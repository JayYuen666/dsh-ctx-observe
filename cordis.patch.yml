# ctx-observe（2026-09-03）：上下文观测 + 战略压缩建议 + token metrics。
# ECC（MIT）suggest-compact + cost-tracker 移植，按 dsh 事件面改写：
#   - usage 来源：官方折叠口径（token-meter usage-projection.ts usageOf）——
#     session/event 的 assistant/message.data.usage 优先，缺席回落 data.stream
#     里最后一个 type:'usage' chunk；assistant/attempt（废弃/重试结算）只有
#     stream 一条路。不读 transcript（ECC cost-tracker 前版读错字段 52 天全 0
#     的教训已吸收）；
#   - 主信号 token 用量：request/context 权威窗口 × contextRatio（默认 70%），
#     settings 显式 contextThresholdTokens 永远优先；辅信号工具计数兜底；
#     原因：不同模型窗口不同（128k/200k/1M…），固定阈值是隐藏 bug 源；
#   - 建议注入：agent/pre-step waterfall 以 prepend 注册（全链最外层），先
#     next() 取下游合成决策、再把建议块追加到末尾；非对象/缺 messages/ reject
#     的决策一律原样透传，且提醒名额只在注入成立时消费（UsageWatch 的
#     RemindProposal.commit）。阶段边界做检查点压缩，避免 auto-compact 任务中段
#     任意截断；
#   - metrics：逐回合流水按进程分片写 $DSH_HOME/cache/ctx-observe/ctx-observe.<pid>.jsonl
#     （落盘根由 @deepseek-ai/dsh-home-paths 的 dshHomePath("cache", …) 单源解析；cache 是
#     "可丢弃的派生数据"目录，子目录是本包命名空间。单写者分片，避免并发进程在
#     同一文件上截断重写互相丢行），
#     GET /_dsh/ctx-observe/metrics 聚合全部分片按 ts 升序全量返回。
# 设置卡：enabled + suggestEnabled + metricsEnabled 开关 + contextThresholdTokens /
# contextRatio / remindRatio 三个数值（卡上改比例实时同步活跃会话）。
#
# 组合包层（2026-09-05 bundle 化）：本文件由 package.json 的 dsh.bundle.patch
# 指向，随 `dsh plugin --profile web add/remove ./plugins/ctx-observe` 维护。
# 行按裸包名引用本包（client-modules 只扫描裸包名条目的 dsh.client 声明）。
# 注意 pnpm ≥12.3.0：12.0.0 的 add 本地目录有 #14437 bug。
- insert:
    - id: ctx-observe
      name: "@jayyuen66/dsh-ctx-observe"
